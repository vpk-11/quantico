name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'graphify-out/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'graphify-out/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: vpk-11/workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: '3.12'
      working-directory: 'pipeline'
      test-cmd: 'pytest'
